<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>paperdl 文献下载器</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f0f2f5;
    --card: #ffffff;
    --border: #e0e3e8;
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --success: #16a34a;
    --danger: #dc2626;
    --warning: #d97706;
    --muted: #6b7280;
    --text: #111827;
    --radius: 10px;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 24px 16px 48px;
  }
  h1 { font-size: 1.6rem; font-weight: 700; margin-bottom: 4px; }
  h2 { font-size: 1.1rem; font-weight: 600; margin-bottom: 12px; color: #374151; }
  .subtitle { color: var(--muted); font-size: 0.9rem; margin-bottom: 24px; }
  .container { max-width: 960px; margin: 0 auto; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 24px;
    margin-bottom: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,.06);
  }
  label { display: block; font-size: 0.85rem; font-weight: 500; color: #374151; margin-bottom: 6px; }
  textarea {
    width: 100%; min-height: 120px; border: 1px solid var(--border); border-radius: 6px;
    padding: 10px 12px; font-size: 0.9rem; resize: vertical; font-family: monospace;
    line-height: 1.5;
  }
  textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
  input[type=file] {
    display: block; width: 100%; padding: 8px 10px; border: 1px dashed var(--border);
    border-radius: 6px; background: #f9fafb; font-size: 0.9rem; cursor: pointer;
  }
  input[type=number] {
    width: 90px; padding: 7px 10px; border: 1px solid var(--border); border-radius: 6px;
    font-size: 0.9rem;
  }
  input[type=number]:focus { outline: none; border-color: var(--primary); }
  .row { display: flex; gap: 16px; align-items: flex-end; flex-wrap: wrap; }
  .field { display: flex; flex-direction: column; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 9px 18px;
    border: none; border-radius: 6px; font-size: 0.9rem; font-weight: 500;
    cursor: pointer; transition: background .15s;
  }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-hover); }
  .btn-primary:disabled { background: #93c5fd; cursor: default; }
  .btn-secondary { background: #f3f4f6; color: #374151; border: 1px solid var(--border); }
  .btn-secondary:hover { background: #e5e7eb; }
  .btn-danger { background: #fee2e2; color: var(--danger); border: 1px solid #fca5a5; }
  .btn-danger:hover { background: #fecaca; }
  .btn-sm { padding: 5px 12px; font-size: 0.82rem; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .chip {
    display: inline-block; padding: 4px 10px; border-radius: 20px;
    background: #eff6ff; color: var(--primary); border: 1px solid #bfdbfe;
    font-size: 0.82rem; font-weight: 500;
  }
  .chip-count { background: #f0fdf4; color: var(--success); border-color: #bbf7d0; }
  .progress-wrap {
    background: #e5e7eb; border-radius: 99px; height: 10px; overflow: hidden; margin: 12px 0 6px;
  }
  .progress-bar {
    height: 100%; background: var(--primary); border-radius: 99px;
    transition: width .4s ease; min-width: 0;
  }
  .progress-bar.done { background: var(--success); }
  .status-line { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--muted); }
  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 4px;
    font-size: 0.78rem; font-weight: 600; white-space: nowrap;
  }
  .badge-success { background: #dcfce7; color: var(--success); }
  .badge-failed  { background: #fee2e2; color: var(--danger); }
  .badge-pending { background: #f3f4f6; color: var(--muted); }
  .badge-running { background: #eff6ff; color: var(--primary); }
  .badge-done    { background: #dcfce7; color: var(--success); }
  .badge-error   { background: #fee2e2; color: var(--danger); }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  th {
    text-align: left; padding: 8px 10px; background: #f9fafb;
    border-bottom: 2px solid var(--border); font-weight: 600; color: #374151;
    white-space: nowrap;
  }
  td { padding: 8px 10px; border-bottom: 1px solid #f0f0f0; vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #fafafa; }
  .doi-cell { font-family: monospace; font-size: 0.78rem; color: var(--muted); word-break: break-all; }
  .title-cell { max-width: 260px; }
  .reason-cell { font-size: 0.78rem; color: var(--danger); max-width: 160px; word-break: break-word; }
  .current-doi {
    font-size: 0.82rem; color: var(--primary); margin-top: 6px;
    min-height: 18px; font-family: monospace;
  }
  .summary-nums { display: flex; gap: 16px; margin: 8px 0; }
  .num-box { text-align: center; }
  .num-box .n { font-size: 1.4rem; font-weight: 700; }
  .num-box .l { font-size: 0.75rem; color: var(--muted); }
  .num-success .n { color: var(--success); }
  .num-failed  .n { color: var(--danger); }
  .num-total   .n { color: var(--primary); }
  .action-row { display: flex; gap: 10px; flex-wrap: wrap; margin: 12px 0; }
  #history-list { font-size: 0.85rem; }
  .hist-item {
    display: flex; align-items: center; gap: 12px; padding: 8px 12px;
    border: 1px solid var(--border); border-radius: 6px; margin-bottom: 6px;
    cursor: pointer; transition: background .12s;
  }
  .hist-item:hover { background: #f9fafb; }
  .hist-id { font-family: monospace; font-size: 0.78rem; color: var(--muted); }
  .hist-info { flex: 1; }
  .hist-meta { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }
  .sep { height: 1px; background: var(--border); margin: 16px 0; }
  .alert {
    padding: 10px 14px; border-radius: 6px; font-size: 0.88rem; margin-bottom: 12px;
    background: #fefce8; border: 1px solid #fde68a; color: #92400e;
  }
  .hidden { display: none !important; }
  @media(max-width:600px) {
    .row { flex-direction: column; }
    .summary-nums { gap: 10px; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>📄 paperdl</h1>
  <p class="subtitle">按 DOI 批量下载文献 · 本地网页版</p>

  <!-- ① 解析输入 -->
  <div class="card">
    <h2>第一步：输入 DOI</h2>
    <div style="margin-bottom:12px">
      <label>粘贴 DOI / 文本（每行一个，或包含 DOI 的任意文本）</label>
      <textarea id="txt-input" placeholder="10.1007/s00020-001-1111-x&#10;10.1016/j.cell.2023.01.001&#10;..."></textarea>
    </div>
    <div style="margin-bottom:14px">
      <label>或上传文件（.txt / .csv / .xls / .xlsx）</label>
      <input type="file" id="file-input" accept=".txt,.csv,.xls,.xlsx">
    </div>
    <button class="btn btn-primary" id="btn-extract" onclick="doExtract()">🔍 解析 DOI</button>
    <div id="extract-result" class="hidden" style="margin-top:14px">
      <div id="extract-alert"></div>
      <div class="chips" id="doi-chips"></div>
    </div>
  </div>

  <!-- ② 下载设置 -->
  <div class="card" id="section-download" style="display:none">
    <h2>第二步：配置并下载</h2>
    <div class="row" style="margin-bottom:14px">
      <div class="field">
        <label>请求间隔最短（秒）</label>
        <input type="number" id="delay-min" value="8" min="1" max="120">
      </div>
      <div class="field">
        <label>请求间隔最长（秒）</label>
        <input type="number" id="delay-max" value="20" min="1" max="300">
      </div>
      <div class="field" style="align-self:flex-end">
        <button class="btn btn-primary" id="btn-start" onclick="startJob()">🚀 开始下载</button>
      </div>
    </div>
  </div>

  <!-- ③ 进度 + 结果 -->
  <div class="card hidden" id="section-progress">
    <h2>下载进度</h2>
    <div id="job-status-badge" style="margin-bottom:8px"></div>
    <div class="summary-nums">
      <div class="num-box num-total">
        <div class="n" id="num-total">0</div>
        <div class="l">总计</div>
      </div>
      <div class="num-box num-success">
        <div class="n" id="num-success">0</div>
        <div class="l">成功</div>
      </div>
      <div class="num-box num-failed">
        <div class="n" id="num-failed">0</div>
        <div class="l">失败</div>
      </div>
    </div>
    <div class="progress-wrap"><div class="progress-bar" id="progress-bar"></div></div>
    <div class="status-line">
      <span id="progress-label">0 / 0</span>
      <span id="progress-pct">0%</span>
    </div>
    <div class="current-doi" id="current-doi"></div>
    <div class="action-row">
      <button class="btn btn-danger btn-sm" id="btn-retry" onclick="retryFailed()" style="display:none">🔄 重试失败</button>
      <a class="btn btn-secondary btn-sm" id="btn-zip" href="#" style="display:none">📦 打包下载 ZIP</a>
      <div id="email-send-row" style="display:none;align-items:center;gap:6px;flex-wrap:wrap">
        <input type="email" id="email-to" placeholder="收件人邮箱"
               style="padding:5px 10px;border:1px solid var(--border);border-radius:6px;font-size:0.82rem;width:200px">
        <button class="btn btn-secondary btn-sm" id="btn-send-email" onclick="sendEmail()">✉️ 发送到邮箱</button>
      </div>
    </div>
    <div id="email-status" style="font-size:0.82rem;margin-top:6px;min-height:18px"></div>
    <div class="sep"></div>
    <h2>文件详情</h2>
    <div style="overflow-x:auto">
      <table id="result-table">
        <thead><tr>
          <th>状态</th>
          <th>DOI</th>
          <th>标题</th>
          <th>出版商</th>
          <th>失败原因</th>
          <th>操作</th>
        </tr></thead>
        <tbody id="result-tbody"></tbody>
      </table>
    </div>
  </div>

  <!-- ④ 历史 -->
  <div class="card">
    <h2>历史任务</h2>
    <button class="btn btn-secondary btn-sm" onclick="loadHistory()" style="margin-bottom:12px">刷新</button>
    <div id="history-list"><span style="color:var(--muted);font-size:.85rem">加载中…</span></div>
  </div>
</div>

<script>
"use strict";

let currentJobId = null;
let pollTimer = null;
let extractedDois = [];

/* ── 工具函数 ── */
function fmtTime(iso) {
  if (!iso) return "";
  try { return new Date(iso).toLocaleString("zh-CN"); } catch { return iso; }
}
function statusBadge(s) {
  const map = {success:"badge-success",failed:"badge-failed",pending:"badge-pending",
                running:"badge-running",done:"badge-done",error:"badge-error"};
  const label = {success:"成功",failed:"失败",pending:"等待",running:"下载中",done:"完成",error:"错误"};
  return `<span class="badge ${map[s]||'badge-pending'}">${label[s]||s}</span>`;
}

/* ── 第一步：解析 ── */
async function doExtract() {
  const btn = document.getElementById("btn-extract");
  btn.disabled = true; btn.textContent = "解析中…";
  try {
    const fd = new FormData();
    const fileInput = document.getElementById("file-input");
    const txt = document.getElementById("txt-input").value.trim();
    if (fileInput.files.length > 0) {
      fd.append("file", fileInput.files[0]);
    } else if (txt) {
      fd.append("text", txt);
    } else {
      alert("请输入 DOI 或上传文件。"); return;
    }
    const res = await fetch("/api/extract", {method:"POST", body:fd});
    const data = await res.json();
    extractedDois = data.dois || [];

    const alertEl = document.getElementById("extract-alert");
    alertEl.innerHTML = "";
    if (extractedDois.length === 0) {
      alertEl.innerHTML = '<div class="alert">未识别到任何 DOI，请检查输入格式。</div>';
    }

    const chips = document.getElementById("doi-chips");
    chips.innerHTML = `<span class="chip chip-count">共 ${data.count} 个 DOI</span>`;
    for (const [k, v] of Object.entries(data.distribution || {})) {
      chips.innerHTML += `<span class="chip">${k}: ${v}</span>`;
    }
    document.getElementById("extract-result").classList.remove("hidden");
    document.getElementById("section-download").style.display = extractedDois.length > 0 ? "" : "none";
  } catch(e) {
    alert("解析失败: " + e);
  } finally {
    btn.disabled = false; btn.textContent = "🔍 解析 DOI";
  }
}

/* ── 第二步：开始下载 ── */
async function startJob() {
  if (!extractedDois.length) { alert("没有 DOI 可以下载。"); return; }
  const btn = document.getElementById("btn-start");
  btn.disabled = true; btn.textContent = "提交中…";
  try {
    const body = {
      dois: extractedDois,
      delay_min: parseFloat(document.getElementById("delay-min").value) || 8,
      delay_max: parseFloat(document.getElementById("delay-max").value) || 20,
    };
    const res = await fetch("/api/jobs", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify(body)
    });
    if (!res.ok) { const t = await res.text(); alert("提交失败: " + t); return; }
    const data = await res.json();
    currentJobId = data.job_id;
    openJob(currentJobId);
  } catch(e) {
    alert("提交失败: " + e);
  } finally {
    btn.disabled = false; btn.textContent = "🚀 开始下载";
  }
}

/* ── 轮询显示进度 ── */
function openJob(jobId) {
  currentJobId = jobId;
  if (pollTimer) clearInterval(pollTimer);
  document.getElementById("section-progress").classList.remove("hidden");
  document.getElementById("section-progress").scrollIntoView({behavior:"smooth"});
  pollJob();
  pollTimer = setInterval(() => {
    const s = document.getElementById("job-status-badge").dataset.status;
    if (s === "done" || s === "error") clearInterval(pollTimer);
    else pollJob();
  }, 2000);
}

async function pollJob() {
  if (!currentJobId) return;
  try {
    const res = await fetch("/api/jobs/" + currentJobId);
    if (!res.ok) return;
    const job = await res.json();
    renderJobProgress(job);
  } catch {}
}

function renderJobProgress(job) {
  const total = job.total || 0;
  const done = job.done || 0;
  const pct = total > 0 ? Math.round(done / total * 100) : 0;

  document.getElementById("num-total").textContent = total;
  document.getElementById("num-success").textContent = job.success || 0;
  document.getElementById("num-failed").textContent = job.failed || 0;

  const bar = document.getElementById("progress-bar");
  bar.style.width = pct + "%";
  if (job.status === "done") bar.classList.add("done"); else bar.classList.remove("done");

  document.getElementById("progress-label").textContent = `${done} / ${total}`;
  document.getElementById("progress-pct").textContent = pct + "%";

  const curEl = document.getElementById("current-doi");
  curEl.textContent = job.status === "running" && job.current
    ? "当前: " + job.current : "";

  const badgeEl = document.getElementById("job-status-badge");
  badgeEl.innerHTML = statusBadge(job.status) + " &nbsp;" + fmtTime(job.created_at);
  badgeEl.dataset.status = job.status;

  // 重试按钮
  const btnRetry = document.getElementById("btn-retry");
  if ((job.status === "done" || job.status === "error") && job.failed > 0) {
    btnRetry.style.display = "";
  } else {
    btnRetry.style.display = "none";
  }
  // ZIP 按钮
  const btnZip = document.getElementById("btn-zip");
  if (job.success > 0) {
    btnZip.style.display = "";
    btnZip.href = "/api/jobs/" + job.id + "/zip";
  } else {
    btnZip.style.display = "none";
  }
  // 发送邮件行
  const emailRow = document.getElementById("email-send-row");
  emailRow.style.display = job.success > 0 ? "flex" : "none";

  // 结果表格
  const tbody = document.getElementById("result-tbody");
  tbody.innerHTML = "";
  const items = Array.isArray(job.items) ? job.items : Object.values(job.items || {});
  for (const it of items) {
    const tr = document.createElement("tr");
    let actionCell = "";
    if (it.status === "success" && it.file) {
      const encName = encodeURIComponent(it.file);
      const base = `/api/jobs/${job.id}/file?name=${encName}`;
      actionCell =
        `<a class="btn btn-secondary btn-sm" href="${base}" target="_blank">预览</a> ` +
        `<a class="btn btn-secondary btn-sm" href="${base}&dl=1" download="${esc(it.file)}">下载</a>`;
    }
    tr.innerHTML = `
      <td>${statusBadge(it.status)}</td>
      <td class="doi-cell">${esc(it.doi)}</td>
      <td class="title-cell">${esc(it.title || "")}</td>
      <td>${esc(it.publisher || "")}</td>
      <td class="reason-cell">${esc(it.reason || "")}</td>
      <td>${actionCell}</td>
    `;
    tbody.appendChild(tr);
  }
}

function esc(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

/* ── 重试失败 ── */
async function retryFailed() {
  if (!currentJobId) return;
  const btn = document.getElementById("btn-retry");
  btn.disabled = true; btn.textContent = "提交重试…";
  try {
    const res = await fetch("/api/jobs/" + currentJobId + "/retry", {method:"POST"});
    const data = await res.json();
    if (data.retrying > 0) {
      document.getElementById("job-status-badge").dataset.status = "running";
      if (pollTimer) clearInterval(pollTimer);
      pollJob();
      pollTimer = setInterval(() => {
        const s = document.getElementById("job-status-badge").dataset.status;
        if (s === "done" || s === "error") clearInterval(pollTimer);
        else pollJob();
      }, 2000);
    }
  } catch(e) {
    alert("重试请求失败: " + e);
  } finally {
    btn.disabled = false; btn.textContent = "🔄 重试失败";
  }
}

/* ── 发送邮件 ── */
async function sendEmail() {
  if (!currentJobId) return;
  const toInput = document.getElementById("email-to");
  const to = toInput.value.trim();
  if (!to) { alert("请填写收件人邮箱。"); return; }
  const btn = document.getElementById("btn-send-email");
  const statusEl = document.getElementById("email-status");
  btn.disabled = true; btn.textContent = "发送中…";
  statusEl.style.color = "var(--muted)";
  statusEl.textContent = "正在发送…";
  try {
    const res = await fetch("/api/jobs/" + currentJobId + "/email", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({to: to})
    });
    const data = await res.json();
    if (data.ok) {
      statusEl.style.color = "var(--success)";
      statusEl.textContent = "已发送 " + data.emails + " 封邮件（共 " + data.files + " 篇 PDF）";
    } else {
      statusEl.style.color = "var(--danger)";
      statusEl.textContent = "发送失败：" + (data.error || data.detail || "未知错误");
    }
  } catch(e) {
    statusEl.style.color = "var(--danger)";
    statusEl.textContent = "发送失败：" + e;
  } finally {
    btn.disabled = false; btn.textContent = "✉️ 发送到邮箱";
  }
}

/* ── 历史 ── */
async function loadHistory() {
  const el = document.getElementById("history-list");
  el.innerHTML = '<span style="color:var(--muted);font-size:.85rem">加载中…</span>';
  try {
    const res = await fetch("/api/jobs");
    const jobs = await res.json();
    if (!jobs.length) {
      el.innerHTML = '<span style="color:var(--muted);font-size:.85rem">暂无历史任务。</span>';
      return;
    }
    el.innerHTML = jobs.map(j => `
      <div class="hist-item" onclick="openJob('${esc(j.id)}')">
        <div class="hist-info">
          <div><strong>${esc(j.id)}</strong> ${statusBadge(j.status)}</div>
          <div class="hist-meta">${fmtTime(j.created_at)} &nbsp;|&nbsp; 成功 ${j.success}/${j.total} &nbsp;|&nbsp; 失败 ${j.failed}</div>
        </div>
      </div>
    `).join("");
  } catch(e) {
    el.innerHTML = '<span style="color:var(--danger)">加载失败</span>';
  }
}

/* 初始化 */
loadHistory();
</script>
</body>
</html>
